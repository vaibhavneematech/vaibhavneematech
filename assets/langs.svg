      </rect>
      <rect x="326.2" y="0" width="0" height="14" fill="#ea2d2e">
        <animate attributeName="width" from="0" to="105.8" begin="0.70s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
      </g>
    </g>

    
    <g transform="translate(24,100)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.10s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="-24 0" to="0 0" begin="1.10s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <circle cx="6" cy="-4" r="6" fill="#5c6bc0"/>
      <text x="20" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="14" fill="#f3e8ff">C</text>
      <text x="420" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">42.0%</text>
    </g>
    <g transform="translate(24,132)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.28s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="-24 0" to="0 0" begin="1.28s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <circle cx="6" cy="-4" r="6" fill="#00599C"/>
      <text x="20" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="14" fill="#f3e8ff">C++</text>
      <text x="420" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">33.5%</text>
