      <circle cx="6" cy="-4" r="6" fill="#ea2d2e"/>
      <text x="20" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="14" fill="#f3e8ff">Java</text>
      <text x="420" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">24.5%</text>
