<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#170821"/>
    </linearGradient>
    <linearGradient id="accG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6fd8"/>
      <stop offset="50%" stop-color="#e0369d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip1"><rect x="0" y="0" width="480" height="210" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cardClip1)">
    <rect width="480" height="210" fill="url(#bgG)"/>
    <rect x="1" y="1" width="478" height="208" rx="17" fill="none" stroke="#3d2255" stroke-width="1.5"/>
    <text x="24" y="30" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="15" font-weight="700" fill="#f3e8ff">Vaibhav's GitHub Stats</text>

    <g transform="translate(90,118)">
      <circle r="46" fill="none" stroke="#3d2255" stroke-width="9"/>
      <circle r="46" fill="none" stroke="url(#accG)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="289.0" stroke-dashoffset="289.0" transform="rotate(-90)" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" from="289.0" to="26.0" begin="0.3s" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </circle>
      <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="26" font-weight="800" fill="#f3e8ff" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
        A+
      </text>
      <text x="0" y="26" text-anchor="middle" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="9.5" fill="#c9b6e0" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
        RANK
      </text>
    </g>

    
    <g transform="translate(190,40)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.50s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="40 0" to="0 0" begin="0.50s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <text x="0" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">Total Stars</text>
      <text x="190" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">38</text>
      <rect x="0" y="8" width="190" height="6" rx="3" fill="#3d2255"/>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accG)">
        <animate attributeName="width" from="0" to="104.5" begin="0.75s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
    </g>
    <g transform="translate(190,73)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.68s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="40 0" to="0 0" begin="0.68s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <text x="0" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">Total Commits (2025)</text>
      <text x="190" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">612</text>
      <rect x="0" y="8" width="190" height="6" rx="3" fill="#3d2255"/>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accG)">
        <animate attributeName="width" from="0" to="155.8" begin="0.93s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
    </g>
    <g transform="translate(190,106)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.86s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="40 0" to="0 0" begin="0.86s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <text x="0" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">Total PRs</text>
      <text x="190" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">24</text>
      <rect x="0" y="8" width="190" height="6" rx="3" fill="#3d2255"/>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accG)">
        <animate attributeName="width" from="0" to="76.0" begin="1.11s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
    </g>
    <g transform="translate(190,139)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.04s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="40 0" to="0 0" begin="1.04s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <text x="0" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">Total Issues</text>
      <text x="190" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">11</text>
      <rect x="0" y="8" width="190" height="6" rx="3" fill="#3d2255"/>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accG)">
        <animate attributeName="width" from="0" to="47.5" begin="1.29s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
    </g>
    <g transform="translate(190,172)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.22s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="40 0" to="0 0" begin="1.22s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <text x="0" y="0" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" fill="#c9b6e0">Contributed To</text>
      <text x="190" y="0" text-anchor="end" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">5</text>
      <rect x="0" y="8" width="190" height="6" rx="3" fill="#3d2255"/>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accG)">
        <animate attributeName="width" from="0" to="57.0" begin="1.47s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
    </g>
  </g>
</svg>