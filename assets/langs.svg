<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#170821"/>
    </linearGradient>
    <linearGradient id="accG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6fd8"/>
      <stop offset="50%" stop-color="#e0369d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip2"><rect x="0" y="0" width="480" height="210" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cardClip2)">
    <rect width="480" height="210" fill="url(#bgG)"/>
    <rect x="1" y="1" width="478" height="208" rx="17" fill="none" stroke="#3d2255" stroke-width="1.5"/>
    <text x="24" y="34" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="15" font-weight="700" fill="#f3e8ff">Most Used Languages</text>

    <g transform="translate(24,54)">
      <rect x="0" y="0" width="432" height="14" rx="7" fill="#3d2255"/>
      <g clip-path="inset(0 round 7px)">
        
      <rect x="0.0" y="0" width="0" height="14" fill="#5c6bc0">
        <animate attributeName="width" from="0" to="181.4" begin="0.40s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
      <rect x="181.4" y="0" width="0" height="14" fill="#00599C">
